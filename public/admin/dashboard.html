<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <style>
    body { font-family: Arial; background:#f0f2f5; padding:10px; }
    .card { background:white; padding:15px; margin:10px 0; border-radius:10px; }
    input { width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:5px; }
    button { width:100%; padding:12px; background:#1a237e; color:white; border:none; border-radius:5px; margin-top:5px; }
    .chips { display:flex; overflow-x:auto; gap:8px; padding:8px 0; }
    .chip { flex:0 0 auto; padding:8px 15px; background:#e8eaf6; border-radius:20px; cursor:pointer; font-weight:bold; }
    .chip.on { background:#1a237e; color:white; }
    .msg { color:green; margin-top:5px; }
  </style>
</head>
<body>
  <h2>Admin</h2>

  <div class="card">
    <h3>Create Owner</h3>
    <input id="ownerName" placeholder="Name">
    <input id="ownerEmail" placeholder="Email">
    <input id="ownerPhone" placeholder="Phone">
    <input id="ownerPassword" type="password" placeholder="Password">
    <p>Floor:</p>
    <div id="floorChips" class="chips"></div>
    <p>Room:</p>
    <div id="roomChips" class="chips"></div>
    <button onclick="createOwner()">Create Owner</button>
    <div id="ownerMsg" class="msg"></div>
  </div>

  <div class="card">
    <h3>Create Guard</h3>
    <input id="guardName" placeholder="Name">
    <input id="guardEmail" placeholder="Email">
    <input id="guardPassword" type="password" placeholder="Password">
    <button onclick="createGuard()">Create Guard</button>
    <div id="guardMsg" class="msg"></div>
  </div>

  <button onclick="logout()">Logout</button>

  <script>
    const token = localStorage.getItem('adminToken');
    if (!token) location.href='/admin/index.html';

    let rooms=[], selFloor=null, selRoom=null;

    fetch('/api/admin/rooms', {headers:{'Authorization':'Bearer '+token}})
      .then(r=>r.json())
      .then(data=>{rooms=data; showFloors();})
      .catch(e=>console.log(e));

    function showFloors(){
      const floors=[...new Set(rooms.map(r=>r.floor))].sort((a,b)=>a-b);
      document.getElementById('floorChips').innerHTML='';
      floors.forEach(f=>{
        const c=document.createElement('div'); c.className='chip'; c.textContent='Floor '+f;
        c.onclick=()=>{selFloor=f;selRoom=null; document.querySelectorAll('#floorChips .chip').forEach(x=>x.classList.remove('on')); c.classList.add('on'); showRooms();};
        document.getElementById('floorChips').appendChild(c);
      });
    }

    function showRooms(){
      const cont=document.getElementById('roomChips'); cont.innerHTML='';
      if(!selFloor) return;
      const avail=rooms.filter(r=>r.floor==selFloor && !r.owner);
      if(!avail.length){cont.innerHTML='<span>No rooms available</span>';return;}
      avail.forEach(r=>{
        const c=document.createElement('div'); c.className='chip'; c.textContent='Room '+r.roomNumber;
        c.onclick=()=>{selRoom=r._id; document.querySelectorAll('#roomChips .chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');};
        cont.appendChild(c);
      });
    }

    function createOwner(){
      const name=document.getElementById('ownerName').value, email=document.getElementById('ownerEmail').value, phone=document.getElementById('ownerPhone').value, password=document.getElementById('ownerPassword').value;
      if(!name||!email||!password||!selRoom){document.getElementById('ownerMsg').innerText='Fill all and select room';return;}
      fetch('/api/admin/owners/create',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name,email,phone,password,roomId:selRoom})})
        .then(r=>r.json()).then(d=>{
          document.getElementById('ownerMsg').innerText=d.message||d.error||'Done';
          location.reload();
        });
    }

    function createGuard(){
      const name=document.getElementById('guardName').value, email=document.getElementById('guardEmail').value, password=document.getElementById('guardPassword').value;
      if(!name||!email||!password){document.getElementById('guardMsg').innerText='Fill all';return;}
      fetch('/api/admin/guards',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({name,email,password})})
        .then(r=>r.json()).then(d=>{document.getElementById('guardMsg').innerText=d.message||d.error||'Done'; location.reload();});
    }

    function logout(){localStorage.removeItem('adminToken'); location.href='/admin/index.html';}
  </script>
</body>
</html>
