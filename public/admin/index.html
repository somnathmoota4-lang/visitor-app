<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial; padding: 15px; max-width: 600px; margin: auto; background: #f5f5f5; }
    h2 { color: #1a73e8; }
    .section { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
    th { background: #f0f0f0; }
    .msg { color: green; margin: 10px 0; }
    .err { color: red; }
  </style>
</head>
<body>
  <h2>Admin Dashboard</h2>
  
  <div id="loginSection">
    <div class="section">
      <h3>Admin Login</h3>
      <input type="email" id="adminEmail" placeholder="Email">
      <input type="password" id="adminPassword" placeholder="Password">
      <button onclick="adminLogin()">Login</button>
      <p class="err" id="loginError"></p>
    </div>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="section">
      <h3>Create Guard Account</h3>
      <input type="text" id="guardName" placeholder="Guard Name">
      <input type="email" id="guardEmail" placeholder="Guard Email">
      <input type="password" id="guardPassword" placeholder="Password">
      <button onclick="createGuard()">Create Guard</button>
      <p class="msg" id="guardMsg"></p>
    </div>

    <div class="section">
      <h3>Create Owner Account</h3>
      <input type="text" id="ownerName" placeholder="Owner Name">
      <input type="email" id="ownerEmail" placeholder="Owner Email">
      <input type="password" id="ownerPassword" placeholder="Password">
      <select id="ownerRoom">
        <option value="">Select Room</option>
      </select>
      <button onclick="createOwner()">Create Owner</button>
      <p class="msg" id="ownerMsg"></p>
    </div>

    <div class="section">
      <h3>All Visitors</h3>
      <div id="visitorTable">No visitors yet</div>
    </div>

    <button onclick="logout()" style="background:#666;color:white;padding:10px;width:100%;border:none;border-radius:5px;">Logout</button>
  </div>

  <script>
    var adminToken = '';

    function adminLogin() {
      var email = document.getElementById('adminEmail').value;
      var password = document.getElementById('adminPassword').value;
      
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.token) {
          adminToken = data.token;
          document.getElementById('loginSection').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          loadRooms();
          loadVisitors();
        } else {
          document.getElementById('loginError').innerText = data.error || 'Login failed';
        }
      })
      .catch(function(err) {
        document.getElementById('loginError').innerText = 'Connection error';
      });
    }

    function loadRooms() {
      fetch('/api/admin/rooms', {
        headers: { 'Authorization': 'Bearer ' + adminToken }
      })
      .then(function(res) { return res.json(); })
      .then(function(rooms) {
        var select = document.getElementById('ownerRoom');
        select.innerHTML = '<option value="">Select Room</option>';
        rooms.forEach(function(room) {
          var opt = document.createElement('option');
          opt.value = room._id;
          opt.textContent = 'Floor ' + room.floor + ' - Room ' + room.roomNumber;
          select.appendChild(opt);
        });
      })
      .catch(function(err) {
        console.log('Error loading rooms:', err);
      });
    }

    function createGuard() {
      var name = document.getElementById('guardName').value;
      var email = document.getElementById('guardEmail').value;
      var password = document.getElementById('guardPassword').value;
      
      fetch('/api/admin/guards', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + adminToken
        },
        body: JSON.stringify({ name: name, email: email, password: password })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        document.getElementById('guardMsg').innerText = data.message || 'Guard created!';
      })
      .catch(function(err) {
        document.getElementById('guardMsg').innerText = 'Error creating guard';
      });
    }

    function createOwner() {
      var name = document.getElementById('ownerName').value;
      var email = document.getElementById('ownerEmail').value;
      var password = document.getElementById('ownerPassword').value;
      var room = document.getElementById('ownerRoom').value;
      
      fetch('/api/admin/owners/create', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + adminToken
        },
        body: JSON.stringify({ name: name, email: email, password: password, roomId: room })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        document.getElementById('ownerMsg').innerText = data.message || 'Owner created!';
        loadRooms();
      })
      .catch(function(err) {
        document.getElementById('ownerMsg').innerText = 'Error creating owner';
      });
    }

    function loadVisitors() {
      fetch('/api/admin/visitors', {
        headers: { 'Authorization': 'Bearer ' + adminToken }
      })
      .then(function(res) { return res.json(); })
      .then(function(visitors) {
        var html = '<table><tr><th>Name</th><th>Phone</th><th>Purpose</th><th>Room</th><th>Time</th><th>Status</th></tr>';
        visitors.forEach(function(v) {
          html += '<tr>' +
            '<td>' + v.name + '</td>' +
            '<td>' + v.phone + '</td>' +
            '<td>' + v.purpose + '</td>' +
            '<td>' + (v.room ? v.room.roomNumber : '') + '</td>' +
            '<td>' + new Date(v.entryTime).toLocaleString() + '</td>' +
            '<td>' + v.status + '</td>' +
            '</tr>';
        });
        html += '</table>';
        document.getElementById('visitorTable').innerHTML = html;
      })
      .catch(function(err) {
        console.log('Error loading visitors:', err);
      });
    }

    function logout() {
      adminToken = '';
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    }
  </script>
</body>
</html>
