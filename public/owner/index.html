<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Dashboard</title>
  <style>
    /* Keep your existing styles */
  </style>
</head>
<body>
  <div class="header"><h2>🏠 My Home</h2></div>
  <div class="container"><div id="tabContent"></div></div>

  <div class="bottom-nav">
    <div class="nav-item active" data-tab="visitors" onclick="showTab('visitors')">
      <span class="icon">👥</span> Visitors
    </div>
    <div class="nav-item" data-tab="complaints" onclick="showTab('complaints')">
      <span class="icon">📝</span> Complaints
    </div>
    <div class="nav-item" data-tab="workers" onclick="showTab('workers')">
      <span class="icon">🔧</span> Help
    </div>
    <div class="nav-item" data-tab="emergency" onclick="showTab('emergency')">
      <span class="icon">🆘</span> Emergency
    </div>
    <div class="nav-item" data-tab="profile" onclick="showTab('profile')">
      <span class="icon">👤</span> Me
    </div>
  </div>

  <script>
    const token = localStorage.getItem('ownerToken');
    if (!token) window.location = 'login.html';

    function showTab(tab) {
      // Remove active from all nav items
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      // Add active to the clicked one
      document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');

      let html = '';
      if (tab === 'visitors') {
        html = `<div class="card"><h3>⏳ Pending</h3><div id="pendingList">Loading...</div></div>
                <div class="card"><h3>📋 History</h3><div id="historyList">Loading...</div></div>`;
        document.getElementById('tabContent').innerHTML = html;
        loadPending();
        loadHistory();
      } else if (tab === 'complaints') {
        html = `<div class="card"><h3>📝 Raise Complaint</h3>
          <input id="complaintTitle" placeholder="Title">
          <select id="complaintCategory">...</select>
          <select id="complaintPriority">...</select>
          <textarea id="complaintDesc" rows="3"></textarea>
          <button class="btn-green" onclick="submitComplaint()">Submit</button>
          <div id="complaintMsg"></div>
        </div>
        <div class="card"><h3>📊 My Complaints</h3><div id="complaintList">Loading...</div></div>`;
        document.getElementById('tabContent').innerHTML = html;
        loadMyComplaints();
      } else if (tab === 'workers') {
        html = `<div class="card"><h3>🔧 Workers</h3><div id="workerList">Loading...</div></div>`;
        document.getElementById('tabContent').innerHTML = html;
        loadWorkers();
      } else if (tab === 'emergency') {
        html = `<div class="card"><h3>🆘 Emergency Contacts</h3><div id="emergencyList">Loading...</div></div>`;
        document.getElementById('tabContent').innerHTML = html;
        loadEmergencyContacts();
      } else if (tab === 'profile') {
        html = `<div class="card"><h3>👤 My Profile</h3>
          <div id="profileInfo"></div>
          <button onclick="window.location.href='/change-password.html'">🔐 Change Password</button>
          <button class="btn-red" onclick="logout()">🚪 Logout</button>
        </div>`;
        document.getElementById('tabContent').innerHTML = html;
        showProfile();
      }
    }

    // ... keep all your existing functions (loadPending, loadHistory, etc.) unchanged ...

    // Initialize first tab
    showTab('visitors');
  </script>
</body>
</html>
