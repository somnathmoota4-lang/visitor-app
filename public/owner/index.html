<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; padding-bottom: 70px; }
    .header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 10px auto; padding: 10px; }
    .card { background: white; padding: 15px; margin: 10px 0; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { color: #1a237e; margin-bottom: 12px; font-size: 16px; border-bottom: 2px solid #e8eaf6; padding-bottom: 8px; }
    input, select, textarea, button { width: 100%; padding: 10px; margin: 6px 0; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: #1a237e; outline: none; }
    button { background: #1a237e; color: white; border: none; font-weight: bold; cursor: pointer; padding: 12px; }
    .btn-green { background: #2e7d32; }
    .btn-red { background: #c62828; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-pending { background: #fff3e0; color: #e65100; }
    .badge-resolved { background: #e8f5e9; color: #2e7d32; }
    .badge-urgent { background: #ffebee; color: #c62828; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 2px solid #e0e0e0; z-index: 100; }
    .nav-item { flex: 1; text-align: center; padding: 10px 5px; cursor: pointer; font-size: 11px; color: #666; }
    .nav-item.active { color: #1a237e; font-weight: bold; }
    .nav-item .icon { font-size: 20px; display: block; }
    .empty-state { text-align: center; padding: 30px; color: #999; }
    .visitor-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #eee; }
    .visitor-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    .visitor-info { flex: 1; }
    .visitor-info strong { font-size: 14px; }
    .visitor-info small { font-size: 11px; color: #666; display: block; }
    .date-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .date-row input { flex: 1; margin: 0; padding: 8px; font-size: 13px; }
    .date-row button { width: auto; padding: 8px 12px; margin: 0; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>
</head>
<body>
  <div class="header"><h2>🏠 My Home</h2></div>
  <div class="container"><div id="tabContent"></div></div>

  <div class="bottom-nav">
    <div class="nav-item active" data-tab="visitors" onclick="showTab('visitors')"><span class="icon">👥</span> Visitors</div>
    <div class="nav-item" data-tab="complaints" onclick="showTab('complaints')"><span class="icon">📝</span> Complaints</div>
    <div class="nav-item" data-tab="profile" onclick="showTab('profile')"><span class="icon">👤</span> Me</div>
  </div>

  <script>
    const token = localStorage.getItem('ownerToken');
    if (!token) window.location = 'login.html';

    // ====================================================
    // FIREBASE PUSH NOTIFICATIONS
    // ====================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAgdLSNm6vG-ZQ2P9B7WtZuiJYvywj6L_Y",
      authDomain: "visitor-app-push-47fd8.firebaseapp.com",
      projectId: "visitor-app-push-47fd8",
      storageBucket: "visitor-app-push-47fd8.firebasestorage.app",
      messagingSenderId: "452927501608",
      appId: "1:452927501608:web:d9ad76cb143bcea7ed0c1d"
    };

    // ⚠️ REPLACE THIS with your new VAPID key
    const VAPID_KEY = "BH_fQwewsSrJ7DLHFS3ORQIb16gxEOHMnYTRCIKPhdjhwheqBGkHh6HGWzNlSUYHxR6-4ukqF9LmswUh1jLdFLM";

    try {
      firebase.initializeApp(firebaseConfig);
      const messaging = firebase.messaging();

      messaging.onMessage((payload) => {
        console.log('🔔 Foreground message:', payload);
        const title = payload.notification?.title || 'Visitor Alert';
        const body = payload.notification?.body || 'New visitor';
        if (Notification.permission === 'granted') {
          new Notification(title, { body: body });
        }
        loadPending();
      });

      function setupToken() {
        Notification.requestPermission()
          .then(permission => {
            console.log('🔔 Permission status:', permission);
            if (permission === 'granted') {
              return navigator.serviceWorker.register('/owner/firebase-messaging-sw.js')
                .then(registration => {
                  console.log('✅ Service worker registered for FCM');
                  return messaging.getToken({
                    vapidKey: VAPID_KEY,
                    serviceWorkerRegistration: registration
                  });
                });
            } else {
              throw new Error('Permission not granted');
            }
          })
          .then(fcmToken => {
            if (!fcmToken) throw new Error('No FCM token returned');
            console.log('📱 FCM Token:', fcmToken);
            return fetch('/api/owner/fcm-token', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({ token: fcmToken })
            });
          })
          .then(res => res.json())
          .then(data => console.log('✅ FCM token saved:', data))
          .catch(err => console.log('⚠️ Push setup:', err.message));
      }

      setTimeout(setupToken, 1000);
    } catch (err) {
      console.log('⚠️ Firebase init skipped:', err.message);
    }
    // ====================================================

    function showTab(tab) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
      let html = '';

      if (tab === 'visitors') {
        html = `<div class="card">
          <h3>⏳ Pending Visitors</h3>
          <div id="pendingList">Loading...</div>
        </div>`;
        document.getElementById('tabContent').innerHTML = html;
        loadPending();
      }

      else if (tab === 'complaints') {
        html = `<div class="card"><h3>📝 Raise Complaint</h3>
          <input id="complaintTitle" placeholder="Title">
          <select id="complaintCategory">
            <option value="">Select Category</option>
            <option value="plumbing">Plumbing</option>
            <option value="electrical">Electrical</option>
            <option value="cleaning">Cleaning</option>
            <option value="other">Other</option>
          </select>
          <textarea id="complaintDesc" rows="3" placeholder="Describe issue"></textarea>
          <button class="btn-green" onclick="submitComplaint()">Submit</button>
          <div id="complaintMsg"></div>
        </div>
        <div class="card"><h3>📊 My Complaints</h3><div id="complaintList">Loading...</div></div>`;
        document.getElementById('tabContent').innerHTML = html;
        loadMyComplaints();
      }

      else if (tab === 'profile') {
        html = `<div class="card">
          <h3>👤 My Profile</h3>
          <div id="profileInfo">Loading...</div>
        </div>
        <div class="card">
          <h3>📋 Visitor History</h3>
          <div class="date-row">
            <input type="date" id="fromDate">
            <input type="date" id="toDate">
            <button onclick="loadHistory()">🔍</button>
          </div>
          <div id="historyList">Loading...</div>
        </div>
        <div class="card">
          <button onclick="window.location.href='/change-password.html'" style="background:#1565c0;">🔐 Change Password</button>
          <button class="btn-red" onclick="logout()" style="margin-top:10px;">🚪 Logout</button>
        </div>`;
        document.getElementById('tabContent').innerHTML = html;
        loadProfile();
        loadHistory();
      }
    }

    function loadPending() {
      fetch('/api/owner/pending', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(res => res.json())
        .then(visitors => {
          const el = document.getElementById('pendingList');
          if (!el) return;
          if (!visitors.length) {
            el.innerHTML = '<div class="empty-state"><p>No pending visitors</p></div>';
            return;
          }
          let html = '';
          visitors.forEach(v => {
            html += `<div class="visitor-item">
              ${v.photo ? `<img src="${v.photo}" alt="photo">` : '<div style="width:50px;height:50px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;">👤</div>'}
              <div class="visitor-info">
                <strong>${v.name}</strong>
                <small>📱 ${v.phone} | 🎯 ${v.purpose}</small>
                <small>🏢 ${v.source || 'N/A'} | 🚪 Room ${v.roomNumber || '-'}</small>
                <small>🕐 ${new Date(v.entryTime).toLocaleString('en-IN')}</small>
              </div>
              <button class="btn-green" style="width:auto;padding:6px 12px;" onclick="respond('${v._id}','approve')">✓</button>
              <button class="btn-red" style="width:auto;padding:6px 12px;" onclick="respond('${v._id}','reject')">✕</button>
            </div>`;
          });
          el.innerHTML = html;
        });
    }

    function loadHistory() {
      const from = document.getElementById('fromDate') ? document.getElementById('fromDate').value : '';
      const to = document.getElementById('toDate') ? document.getElementById('toDate').value : '';
      let url = '/api/owner/history';
      const params = [];
      if (from) params.push('from=' + from);
      if (to) params.push('to=' + to);
      if (params.length) url += '?' + params.join('&');

      fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
        .then(res => res.json())
        .then(visitors => {
          const el = document.getElementById('historyList');
          if (!el) return;
          if (!visitors.length) { el.innerHTML = '<div class="empty-state"><p>No history in this range</p></div>'; return; }
          let html = '';
          visitors.forEach(v => {
            const badgeClass = v.status === 'approved' ? 'badge-resolved' : v.status === 'rejected' ? 'badge-urgent' : 'badge-pending';
            html += `<div class="visitor-item">
              <div class="visitor-info">
                <strong>${v.name}</strong> <span class="badge ${badgeClass}">${v.status}</span>
                <small>📱 ${v.phone} | 🎯 ${v.purpose} | 🏢 ${v.source || 'N/A'}</small>
                <small>🚪 Room ${v.roomNumber || '-'} | 🕐 ${new Date(v.entryTime).toLocaleString('en-IN')}</small>
              </div>
            </div>`;
          });
          el.innerHTML = html;
        });
    }

    function respond(visitId, action) {
      fetch('/api/owner/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ visitId, action })
      })
      .then(res => res.json())
      .then(() => { loadPending(); });
    }

    function submitComplaint() {
      const title = document.getElementById('complaintTitle').value;
      const category = document.getElementById('complaintCategory').value;
      const description = document.getElementById('complaintDesc').value;
      if (!title || !description) { alert('Fill title and description'); return; }
      fetch('/api/society/complaints', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ title, category, description })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('complaintMsg').innerHTML = '<span style="color:green;">✅ Submitted!</span>';
        loadMyComplaints();
      })
      .catch(() => {
        document.getElementById('complaintMsg').innerHTML = '<span style="color:#c62828;">Feature coming soon</span>';
      });
    }

    function loadMyComplaints() {
      fetch('/api/society/complaints/my', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(res => {
          if (!res.ok) return [];
          return res.json();
        })
        .then(complaints => {
          const el = document.getElementById('complaintList');
          if (!el) return;
          if (!complaints.length) { el.innerHTML = '<p>No complaints</p>'; return; }
          let html = '';
          complaints.forEach(c => {
            const badge = c.status === 'pending' ? 'badge-pending' : c.status === 'in_progress' ? 'badge-resolved' : 'badge-urgent';
            html += `<div style="padding:8px;border-bottom:1px solid #eee;">
              <strong>${c.title}</strong> <span class="badge ${badge}">${c.status}</span>
              <br><small>${c.category} | ${new Date(c.createdAt).toLocaleDateString('en-IN')}</small>
            </div>`;
          });
          el.innerHTML = html;
        })
        .catch(() => {
          const el = document.getElementById('complaintList');
          if (el) el.innerHTML = '<p>Complaints feature coming soon</p>';
        });
    }

    function loadProfile() {
      fetch('/api/owner/me', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(res => res.json())
        .then(data => {
          const el = document.getElementById('profileInfo');
          if (!el) return;
          el.innerHTML = `
            <div style="text-align:center;padding:10px;">
              <div style="font-size:50px;">👤</div>
              <h4>${data.name || 'Owner'}</h4>
              <p style="color:#666;">${data.email || ''}</p>
              <p style="color:#666;">📱 ${data.phone || 'Not set'}</p>
              ${data.roomNumber
                ? `<p style="color:#1a237e;font-weight:bold;margin-top:8px;">🚪 Room: ${data.roomNumber}</p>`
                : '<p style="color:#999;margin-top:8px;">No room assigned</p>'}
            </div>`;
        })
        .catch(() => {
          document.getElementById('profileInfo').innerHTML = '<p>Error loading profile</p>';
        });
    }

    function logout() {
      localStorage.removeItem('ownerToken');
      window.location = 'login.html';
    }

    showTab('visitors');
    setInterval(() => {
      const active = document.querySelector('.nav-item.active');
      if (active && active.dataset.tab === 'visitors') loadPending();
    }, 10000);
  </script>
</body>
</html>
