<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Dashboard</title>
  <style>
    body { font-family: Arial; padding: 15px; max-width: 500px; margin: auto; background: #f5f5f5; }
    h2 { color: #1a73e8; }
    .visitor-card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); }
    .visitor-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
    button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; }
    .approve { background: #4CAF50; color: white; }
    .reject { background: #f44336; color: white; }
    #logout { background: #666; color: white; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>👋 Pending Visitors</h2>
  <div id="visitorList"><p>Loading...</p></div>
  <button id="logout" onclick="logout()">Logout</button>

  <script>
    const token = localStorage.getItem('ownerToken');
    if (!token) { window.location = 'login.html'; }

    async function loadPending() {
      const res = await fetch('/api/owner/pending', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const visitors = await res.json();
      if (visitors.length === 0) {
        document.getElementById('visitorList').innerHTML = '<p>No pending visitors</p>';
        return;
      }
      let html = '';
      visitors.forEach(v => {
        html += `
          <div class="visitor-card">
            ${v.photo ? `<img src="${v.photo}" alt="photo">` : '<p>No photo</p>'}
            <p><b>Name:</b> ${v.name}</p>
            <p><b>Phone:</b> ${v.phone}</p>
            <p><b>Purpose:</b> ${v.purpose}</p>
            <p><b>Time:</b> ${new Date(v.entryTime).toLocaleString()}</p>
            <button class="approve" onclick="respond('${v._id}', 'approve')">✅ Approve</button>
            <button class="reject" onclick="respond('${v._id}', 'reject')">❌ Reject</button>
          </div>
        `;
      });
      document.getElementById('visitorList').innerHTML = html;
    }

    async function respond(visitId, action) {
      await fetch('/api/owner/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ visitId, action })
      });
      loadPending();
    }

    function logout() {
      localStorage.removeItem('ownerToken');
      window.location = 'login.html';
    }

    loadPending();
    setInterval(loadPending, 10000);
  </script>
</body>
</html>
