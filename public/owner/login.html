<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Login</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
    h2 { text-align: center; color: #1a237e; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .error { color: red; text-align: center; margin-top: 10px; display: none; }
    .forgot { display: block; text-align: center; margin-top: 15px; color: #1a237e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🏠 Owner Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p class="error" id="error"></p>
    <a class="forgot" href="/forgot-password.html?type=owner">Forgot Password?</a>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.token) {
          if (data.user.role === 'owner') {
            localStorage.setItem('ownerToken', data.token);
            window.location.href = 'index.html';
          } else {
            errorEl.innerText = 'Access denied. Owner only.';
            errorEl.style.display = 'block';
          }
        } else {
          errorEl.innerText = data.error || 'Login failed';
          errorEl.style.display = 'block';
        }
      })
      .catch(() => {
        errorEl.innerText = 'Connection error';
        errorEl.style.display = 'block';
      });
    }
  </script>
</body>
</html>
