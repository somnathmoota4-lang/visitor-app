<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 20px; text-align: center; }
    .container { max-width: 400px; margin: 30px auto; padding: 15px; }
    .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .card h3 { color: #1a237e; margin-bottom: 20px; font-size: 20px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
    input:focus { border-color: #1a237e; outline: none; }
    button { width: 100%; padding: 14px; background: #1a237e; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .msg { text-align: center; margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
    .msg-success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg-error { background: #ffebee; color: #c62828; display: block; }
    .back-link { text-align: center; margin-top: 15px; display: block; color: #1a237e; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🔐 Change Password</h2>
  </div>
  <div class="container">
    <div class="card">
      <h3>Set New Password</h3>
      <input type="password" id="currentPassword" placeholder="Current Password">
      <input type="password" id="newPassword" placeholder="New Password">
      <input type="password" id="confirmPassword" placeholder="Confirm New Password">
      <button onclick="changePassword()">Update Password</button>
      <div class="msg" id="msg"></div>
      <a class="back-link" id="backLink" href="javascript:history.back()">⬅ Go Back</a>
    </div>
  </div>

  <script>
    var token = localStorage.getItem('ownerToken') || localStorage.getItem('guardToken') || localStorage.getItem('adminToken');
    if (!token) { window.location = 'login.html'; }

    function changePassword() {
      var current = document.getElementById('currentPassword').value;
      var newPass = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;
      var msgEl = document.getElementById('msg');

      if (!current || !newPass || !confirm) {
        msgEl.className = 'msg msg-error';
        msgEl.innerText = 'Please fill all fields';
        return;
      }

      if (newPass !== confirm) {
        msgEl.className = 'msg msg-error';
        msgEl.innerText = 'New passwords do not match';
        return;
      }

      if (newPass.length < 6) {
        msgEl.className = 'msg msg-error';
        msgEl.innerText = 'Password must be at least 6 characters';
        return;
      }

      fetch('/api/auth/change-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({
          currentPassword: current,
          newPassword: newPass
        })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.message) {
          msgEl.className = 'msg msg-success';
          msgEl.innerText = '✅ Password changed successfully!';
          document.getElementById('currentPassword').value = '';
          document.getElementById('newPassword').value = '';
          document.getElementById('confirmPassword').value = '';
        } else {
          msgEl.className = 'msg msg-error';
          msgEl.innerText = '❌ ' + (data.error || 'Failed to change password');
        }
      })
      .catch(function() {
        msgEl.className = 'msg msg-error';
        msgEl.innerText = 'Connection error';
      });
    }
  </script>
</body>
</html>
