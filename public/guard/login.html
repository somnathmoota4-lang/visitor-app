<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guard Login</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 400px; margin: auto; }
    input { width: 100%; padding: 10px; margin: 10px 0; }
    button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; font-size: 16px; }
    <a href="/forgot-password.html" style="display:block;text-align:center;margin-top:10px;color:#667eea;font-size:14px;">Forgot Password?</a>
  </style>
</head>
<body>
  <h2>Guard Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="error"></p>
  <script>
    function login() {
  var email = document.getElementById('email').value;
  var password = document.getElementById('password').value;

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(response) { return response.json(); })
  .then(function(data) {
    if (data.token) {
      localStorage.setItem('guardToken', data.token);
      setTimeout(function() {
        window.location.href = 'checkin.html';
      }, 500);
    } else {
      document.getElementById('error').innerText = data.error || 'Login failed';
    }
  })
  .catch(function() {
    document.getElementById('error').innerText = 'Connection error';
  });

</html>
