<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Visitor Check-in</h2>
  <form id="checkinForm" enctype="multipart/form-data">
    <input type="text" id="name" placeholder="Visitor Name" required>
    <input type="tel" id="phone" placeholder="Phone" required>
    <select id="purpose" required>
      <option value="">Select Purpose</option>
      <option>Meeting</option>
      <option>Delivery</option>
      <option>Maintenance</option>
      <option>Personal Visit</option>
    </select>
    <select id="roomId" required>
      <option value="">Select Room</option>
    </select>
    <label>Take Photo:</label>
    <input type="file" id="photo" accept="image/*" capture="environment" required>
    <button type="submit">Check In</button>
  </form>
  <div id="waiting" style="display:none;">
    <h3>Waiting for owner approval...</h3>
    <p id="statusMessage"></p>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="guard.js"></script>
</body>
</html>
