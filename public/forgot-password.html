<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
    h2 { text-align: center; color: #1a237e; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    button { width: 100%; padding: 13px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .msg { text-align: center; margin-top: 10px; padding: 10px; border-radius: 5px; display: none; font-size: 14px; }
    .success { background: #e8f5e9; color: #2e7d32; display: block; }
    .error { background: #ffebee; color: #c62828; display: block; }
    .back-link { display: block; text-align: center; margin-top: 15px; color: #1a237e; text-decoration: none; font-size: 14px; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔑 Forgot Password</h2>

    <div id="step1" class="step active">
      <p style="text-align:center;color:#666;">Enter your email to receive OTP</p>
      <input type="email" id="email" placeholder="Your email">
      <button onclick="sendOTP()">Send OTP</button>
      <div class="msg" id="msg1"></div>
    </div>

    <div id="step2" class="step">
      <p style="text-align:center;color:#666;">Enter OTP and new password</p>
      <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6">
      <input type="password" id="newPass" placeholder="New Password">
      <input type="password" id="confirmPass" placeholder="Confirm Password">
      <button onclick="resetPassword()">Reset Password</button>
      <div class="msg" id="msg2"></div>
    </div>

    <a class="back-link" href="javascript:history.back()">← Back to Login</a>
  </div>

  <script>
    let userEmail = '';

    function sendOTP() {
      const email = document.getElementById('email').value;
      const msg = document.getElementById('msg1');
      if (!email) { msg.className = 'msg error'; msg.innerText = 'Enter email'; return; }

      fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          userEmail = email;
          msg.className = 'msg success';
          msg.innerText = data.message;
          document.getElementById('step1').classList.remove('active');
          document.getElementById('step2').classList.add('active');
        } else {
          msg.className = 'msg error';
          msg.innerText = data.error;
        }
      });
    }

    function resetPassword() {
      const otp = document.getElementById('otp').value;
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;
      const msg = document.getElementById('msg2');

      if (newPass !== confirmPass) { msg.className = 'msg error'; msg.innerText = 'Passwords do not match'; return; }

      fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, otp, newPassword: newPass })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          msg.className = 'msg success';
          msg.innerText = 'Password reset! Redirecting to login...';
          setTimeout(() => window.location.href = '/admin/index.html', 2000);
        } else {
          msg.className = 'msg error';
          msg.innerText = data.error;
        }
      });
    }
  </script>
</body>
</html>
