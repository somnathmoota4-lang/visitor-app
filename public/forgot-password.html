<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 400px; width: 90%; }
    .card h2 { text-align: center; color: #333; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .msg { text-align: center; margin-top: 15px; padding: 10px; border-radius: 8px; display: none; }
    .msg-success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg-error { background: #ffebee; color: #c62828; display: block; }
    .step { display: none; }
    .step.active { display: block; }
    .back-link { text-align: center; margin-top: 20px; display: block; color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔑 Forgot Password</h2>
    
    <div id="step1" class="step active">
      <p style="text-align:center;color:#666;margin-bottom:15px;">Enter your email to receive OTP</p>
      <input type="email" id="email" placeholder="Enter your email">
      <button onclick="sendOTP()">Send OTP</button>
      <div class="msg" id="msg1"></div>
    </div>

    <div id="step2" class="step">
      <p style="text-align:center;color:#666;margin-bottom:15px;">Enter OTP and new password</p>
      <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
      <input type="password" id="newPassword" placeholder="New Password">
      <input type="password" id="confirmPassword" placeholder="Confirm Password">
      <button onclick="resetPassword()">Reset Password</button>
      <div class="msg" id="msg2"></div>
    </div>

    <a class="back-link" href="javascript:history.back()">⬅ Back to Login</a>
  </div>

  <script>
    var userEmail = '';

    function sendOTP() {
      var email = document.getElementById('email').value;
      if (!email) { alert('Please enter email'); return; }
      
      fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
      .then(res => res.json())
      .then(data => {
        var msg = document.getElementById('msg1');
        if (data.message) {
          userEmail = email;
          msg.className = 'msg msg-success';
          msg.innerText = 'OTP sent! Check console or email.';
          document.getElementById('step1').classList.remove('active');
          document.getElementById('step2').classList.add('active');
        } else {
          msg.className = 'msg msg-error';
          msg.innerText = data.error;
        }
      });
    }

    function resetPassword() {
      var otp = document.getElementById('otp').value;
      var newPass = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;
      var msg = document.getElementById('msg2');
      
      if (newPass !== confirm) {
        msg.className = 'msg msg-error';
        msg.innerText = 'Passwords do not match';
        return;
      }
      
      fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, otp: otp, newPassword: newPass })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          msg.className = 'msg msg-success';
          msg.innerText = 'Password reset! Redirecting to login...';
          setTimeout(function() { window.location.href = 'login.html'; }, 2000);
        } else {
          msg.className = 'msg msg-error';
          msg.innerText = data.error;
        }
      });
    }
  </script>
</body>
</html>
